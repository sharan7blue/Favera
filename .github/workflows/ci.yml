name: ci
on:
  push:
    branches-ignore: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint HTML
        run: npx --yes htmlhint@1.1.4 "apps/web/**/*.html"
      - name: Check local links
        run: npx --yes linkinator@6.1.1 apps/web --recurse --skip "^https?://"
      - name: Validate agent files
        run: |
          pip install pyyaml
          python3 scripts/validate_agents.py
      - name: Warn if the form link is still a placeholder
        continue-on-error: true
        run: "! grep -rn REPLACE_ME apps/web"
      - name: List unresolved placeholders (does not fail)
        continue-on-error: true
        run: python3 scripts/check_placeholders.py
