<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60" role="img" aria-label="Faevra – Search Intelligence">
  <title>Faevra</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=DM+Sans:wght@500&amp;display=swap');
    </style>
  </defs>
  <!-- Wordmark -->
  <text
    x="0"
    y="42"
    font-family="'DM Serif Display', Georgia, 'Times New Roman', serif"
    font-size="36"
    font-weight="400"
    fill="#1c1b19"
    letter-spacing="-0.5">Faevra</text>
  <!-- Orange accent rule under the F -->
  <line x1="0" y1="49" x2="22" y2="49" stroke="#d95c1a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Sub-label -->
  <text
    x="1"
    y="60"
    font-family="'DM Sans', system-ui, -apple-system, sans-serif"
    font-size="9"
    font-weight="500"
    fill="#5b5852"
